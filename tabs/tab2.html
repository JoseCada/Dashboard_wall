<div class="scanner-layout full-height">
  <!-- Columna Izquierda: Lista de Seguimiento -->
  <div class="side-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h4 style="margin:0; color:#fff;">👀 Lista de Seguimiento</h4>
      <button onclick="cargarListaSeguimiento()" style="background:none; border:none; color:#787b86; cursor:pointer;" title="Recargar precios">🔄</button>
    </div>

    <div class="table-scroll">
      <table class="mini-table">
        <thead>
          <tr>
            <th></th>
            <th>Ticker</th>
            <th>Precio</th>
            <th>Cambio</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbl-seguimiento-body">
          <tr><td colspan="5" style="text-align:center; color:#787b86;">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Columna Derecha: Análisis profundo (MACD + RSI) + calculadora de riesgo -->
  <div class="chart-card">
    <div class="metrics-bar">
      <div class="m-item"><span class="lbl">ACTIVO</span><span class="val" id="sg-ticker">---</span></div>
      <div class="m-item"><span class="lbl">PRECIO</span><span class="val" id="sg-precio">$0.00</span></div>
      <div class="m-item"><span class="lbl">CAMBIO DIA</span><span class="val" id="sg-cambio">0.00%</span></div>
    </div>

    <div id="tv_chart_seguimiento" class="tv-chart"></div>

    <div class="risk-bar">
      <label>Tipo:</label>
      <select id="op-tipo">
        <option value="Long">📈 Long</option>
        <option value="Short">📉 Short</option>
      </select>

      <label>Entrada:</label>
      <input type="number" id="inp-pe" step="0.01" oninput="recalcularRisk()">

      <label>Stop Loss:</label>
      <input type="number" id="inp-sl" step="0.01" oninput="recalcularRisk()">

      <label>Take Profit:</label>
      <input type="number" id="inp-tp" step="0.01" oninput="recalcularRisk()">

      <label>Ratio R/R:</label>
      <span id="txt-rr" style="font-weight:bold; color:var(--pos-green);">1:2.00</span>

      <button class="btn-primary" onclick="guardarEnPortafolio()" style="margin-left:auto;">
        ➕ Guardar en Portafolio
      </button>
    </div>
  </div>
</div>
