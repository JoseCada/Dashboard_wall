<div class="scanner-layout">
  <!-- Columna Izquierda: Lista de Seguimiento -->
  <div class="side-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h4 style="margin:0; color:#fff;">👀 Lista de Seguimiento</h4>
      <button onclick="cargarListaSeguimiento()" style="background:none; border:none; color:#787b86; cursor:pointer;" title="Recargar precios">🔄</button>
    </div>

    <div class="table-scroll">
      <table class="mini-table">
        <thead>
          <tr>
            <th></th>
            <th>Ticker</th>
            <th>Precio</th>
            <th>Cambio</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbl-seguimiento-body">
          <tr><td colspan="5" style="text-align:center; color:#787b86;">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Columna Derecha: Análisis profundo (MACD + RSI) -->
  <div class="chart-card">
    <div class="metrics-bar">
      <div class="m-item"><span class="lbl">ACTIVO EN ANÁLISIS</span><span class="val" id="sg-ticker">---</span></div>
    </div>

    <div id="tv_chart_seguimiento"></div>
  </div>
</div>
