<div class="scanner-layout full-height">
  <!-- Columna Izquierda: Scanner Real -->
  <div class="side-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h4 style="margin:0; color:#fff;">📋 Scanner Real</h4>
      <button onclick="cargarListaMercadoReal()" style="background:none; border:none; color:#787b86; cursor:pointer;" title="Recargar mercado">🔄</button>
    </div>

    <div class="selectors-row">
      <select id="sel-screener" onchange="cargarListaMercadoReal()">
        <option value="day_gainers">🚀 Top Ganadores</option>
        <option value="day_losers">📉 Top Perdedores</option>
        <option value="most_actives">🔥 Más Activos</option>
      </select>
      <select id="sel-tf-side" onchange="cambiarTimeframe(this.value)">
        <option value="D">1D</option>
        <option value="W">1S</option>
      </select>
    </div>

    <div class="table-scroll">
      <table class="mini-table">
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Precio</th>
            <th>Cambio</th>
          </tr>
        </thead>
        <tbody id="tbl-activos-body">
          <tr><td colspan="3" style="text-align:center; color:#787b86;">Cargando datos en vivo...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Columna Derecha: Métricas, TradingView y acción rápida -->
  <div class="chart-card">
    <div class="metrics-bar">
      <div class="m-item"><span class="lbl">ACTIVO</span><span class="val" id="mb-ticker">---</span></div>
      <div class="m-item"><span class="lbl">PRECIO REAL</span><span class="val" id="mb-precio">$0.00</span></div>
      <div class="m-item"><span class="lbl">CAMBIO DIA</span><span class="val" id="mb-upside">0.00%</span></div>
      <div class="m-item"><span class="lbl">P. OBJETIVO (+15%)</span><span class="val" id="mb-target">$0.00</span></div>
      <div class="m-item"><span class="lbl">R/R ESTIMADO</span><span class="val text-pos" id="mb-rr">1:2.0</span></div>
    </div>

    <div id="tv_chart_container" class="tv-chart"></div>

    <div class="risk-bar" style="justify-content:flex-end;">
      <button class="btn-secondary" onclick="agregarASeguimiento()">
        👁 Seguir este activo
      </button>
    </div>
  </div>
</div>
